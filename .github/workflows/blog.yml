name: Update Blog Posts

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 04:00 KST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from Tistory RSS
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://ddinggo.tistory.com/rss"
          max_post_count: 5
          # 티스토리는 Accept: application/rss+xml 을 406으로 거부한다. */* 만 허용.
          accept_header: "*/*"
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          # HTML 태그를 쓰지 않는다. <sub> 안에 줄바꿈이 들어가면 태그가
          # 닫히지 않아 이후 항목이 중첩되면서 글자가 계속 작아진다.
          template: "- `$date`  [$title]($url)$newline"
          # dateformat 패키지 기준: 소문자 mm = 월, 대문자 MM = 분
          date_format: "yyyy-mm-dd"
          commit_message: "chore: update latest blog posts"
