name: Update Blog Posts

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 04:00 KST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from Tistory RSS
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://ddinggo.tistory.com/rss"
          max_post_count: 5
          # 티스토리는 Accept: application/rss+xml 을 406으로 거부한다. */* 만 허용.
          accept_header: "*/*"
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          template: "- [$title]($url) <sub>$newline`$date`</sub>$newline"
          date_format: "yyyy-MM-dd"
          commit_message: "chore: update latest blog posts"
